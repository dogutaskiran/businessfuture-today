name: Patch BFT source media policy

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source media resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("lib/automation/media.ts")
          s = p.read_text()
          old = '    const reusable=!!imageUrl&&(publicReusable||policyReusable);'
          new = '    const reusable=!!imageUrl&&rightsMode!=="deny"&&(publicReusable||policyReusable||!policy||rightsMode==="review");'
          if old not in s:
              raise SystemExit("Expected reusable line not found")
          s = s.replace(old, new, 1)
          old_basis = 'reusable?(policy?.license_basis||`Reusable license: ${licenseUrl||rightsMode}`):imageUrl?"Publisher image discovered, but no reusable rights profile/license was found"'
          new_basis = 'reusable?(policy?.license_basis||(publicReusable&&licenseUrl?`Reusable license: ${licenseUrl}`:"Editorial source-first default; no explicit reuse restriction recorded")):imageUrl?"Publisher image blocked by an explicit source policy or required-license rule"'
          if old_basis not in s:
              raise SystemExit("Expected license basis line not found")
          s = s.replace(old_basis, new_basis, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "Dogu Taskiran"
          git config user.email "10977151+dogutaskiran@users.noreply.github.com"
          git add lib/automation/media.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use source media unless explicitly restricted"
          git push origin HEAD:main

name: Temporary upgrade BFT editorial media
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-upgrade-editorial-media.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upgrade generated editorial media quality
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/automation/media.ts')
          s = p.read_text()
          s = s.replace('"Prefer documentary realism, precise industrial/product detail, architectural scale, or restrained conceptual compositions.",', '"Prefer specific documentary/editorial photography, precise industrial or product detail, architecture, workplaces, real environments and believable physical scenes. Use restrained conceptual compositions only when the subject genuinely has no concrete visual referent.",\n  "If the story names a company, product, place, industry, device or physical system, build the image around that concrete subject category rather than generic symbolism. Make the frame feel commissioned by a serious global business magazine, not generated stock art.",\n  "Use natural lens behavior, plausible materials, coherent lighting and purposeful composition. Avoid surreal object mashups, decorative 3D blobs, fake dashboards, vague glowing geometry and metaphor-first imagery.",')
          s = s.replace('quality:"medium"', 'quality:"high"')
          p.write_text(s)
          PY
          git config user.name 'Business Future Today Bot'
          git config user.email 'bot@businessfuture.today'
          git add lib/automation/media.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Raise BFT editorial image quality'
          git push origin HEAD:main

name: Temporary BFT home bylines
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-bft-home-bylines.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show editorial voice in story metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/publication/home.tsx')
          s=p.read_text()
          old='return <div className="pub-meta"><span>{story.category}</span><span>{story.readTime}</span></div>;'
          new='return <div className="pub-meta"><span>{story.author?`${story.author.name} · ${story.author.desk}`:story.category}</span><span>{story.readTime}</span></div>;'
          if old not in s:
              raise SystemExit('expected Meta implementation not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Business Future Today Bot'
          git config user.email 'bot@businessfuture.today'
          git add components/publication/home.tsx
          git commit -m 'Show BFT editorial voices across homepage'
          git push origin HEAD:main

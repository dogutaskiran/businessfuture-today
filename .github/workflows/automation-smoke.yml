name: Automation smoke

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run live content automation
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 300 --autput /tmp/bft-response.json --write-out '%{http_code}' "https://businessfuture.today/api/automation/run?bootstrap=${BOOTSTRAP_TOKEN}")"
          cat /tmp/bft-response.json
          echo
          echo "HTTP_STATUS=$code"
          test "$code" -ge 200 -a "$hcode" -lt 300
